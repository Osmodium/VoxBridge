name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild VoxBridge.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Smoke test exports
        shell: pwsh
        run: ./tests/Test-Exports.ps1 -DllPath bin/x64/Release/VoxBridge.dll

      - name: Write SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin/x64/Release/VoxBridge.dll -Algorithm SHA256).Hash
          "$hash  VoxBridge.dll" | Out-File -Encoding ascii bin/x64/Release/VoxBridge.dll.sha256
          "SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          bin/x64/Release/VoxBridge.dll
          bin/x64/Release/VoxBridge.pdb
          bin/x64/Release/VoxBridge.dll.sha256
          LICENSE
          NOTICE
          --title "${{ github.ref_name }}"
          --generate-notes
